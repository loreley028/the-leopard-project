[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "the-leopard-project"
version = "0.1.0"
description = "Configuration-driven after-market sector analytics foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<6",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "PyYAML>=6,<7",
  "httpx>=0.28,<1",
]

[project.scripts]
leopard-project = "leopard_project.cli:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend", "tests"]
markers = [
  "live: explicit network tests excluded from the default CI suite",
]
