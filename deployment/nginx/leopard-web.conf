user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_max_body_size 25m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # A /leopard/ build also needs to work over an SSH tunnel directly to
        # this loopback container. The external IP proxy applies the same
        # prefix removal before forwarding public reader traffic.
        location ^~ /leopard/api/ {
            rewrite ^/leopard(/api/.*)$ $1 break;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Vite fingerprints these files, so the browser can safely retain them
        # across visits until a new release emits a new filename.
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ^~ /leopard/assets/ {
            rewrite ^/leopard/(.*)$ /$1 break;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location ^~ /leopard/ {
            rewrite ^/leopard/(.*)$ /$1 break;
            try_files $uri $uri/ /index.html;
        }

        # The public reverse proxy strips /leopard before forwarding, so this
        # fallback also handles direct public SPA deep links.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
