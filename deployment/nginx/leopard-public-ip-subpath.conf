# Temporary HTTP-only IP virtual host for The Leopard Project.
#
# Install this as its own site only after the matching frontend has been built
# with VITE_APP_BASE_PATH=/leopard/. It intentionally is NOT a default_server:
# other projects and the server root remain outside Leopard's ownership.
server {
    listen 80;
    server_name 47.116.209.204;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Do not redirect or proxy the IP root into Leopard.
    location = / {
        return 404;
    }

    location = /leopard {
        return 301 /leopard/;
    }

    # Plain HTTP must never carry an Admin credential or management mutation.
    location = /leopard/admin {
        return 404;
    }

    location ^~ /leopard/admin/ {
        return 404;
    }

    location = /leopard/api/v1/admin {
        return 404;
    }

    location ^~ /leopard/api/v1/admin/ {
        return 404;
    }

    location = /leopard/api/v1/auth/admin/login {
        return 404;
    }

    location ^~ /leopard/api/v1/ {
        # Public IP access is strictly read-only. Viewer pages use GET APIs.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        rewrite ^/leopard(/api/v1/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Prefix /leopard;
        proxy_read_timeout 120s;
    }

    location ^~ /leopard/ {
        rewrite ^/leopard/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Prefix /leopard;
        proxy_read_timeout 120s;
    }
}
