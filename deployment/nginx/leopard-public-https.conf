# Install only after a real domain resolves to this server and a valid TLS
# certificate is available. It intentionally does not expose the API container
# port directly; the application remains on loopback 127.0.0.1:8080.
server {
    listen 80;
    server_name ${LEOPARD_PUBLIC_DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ${LEOPARD_PUBLIC_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${LEOPARD_PUBLIC_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${LEOPARD_PUBLIC_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
